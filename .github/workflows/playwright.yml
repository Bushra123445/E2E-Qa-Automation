name: E2E QA Automation - Playwright CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:

  # =========================================================
  # 1. BUILD + DEPLOY APPLICATION
  # =========================================================
  build-deploy:
    name: Build & Deploy Demo Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # -----------------------------------------------------
      # Build application
      # -----------------------------------------------------
      - name: Build application
        run: |
          echo "Building application..."
          mkdir -p dist

          cp -r *.html dist/
          cp -r *.css dist/ 2>/dev/null || true
          cp -r *.js dist/ 2>/dev/null || true
          cp -r assets dist/ 2>/dev/null || true

          echo "Build completed."
          ls -la dist

      # -----------------------------------------------------
      # Deploy application to GitHub Pages
      # -----------------------------------------------------
      - name: Deploy application to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: false


  # =========================================================
  # 2. WAIT + RUN PLAYWRIGHT
  # =========================================================
  test:
    name: Playwright E2E Tests
    needs: build-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # -----------------------------------------------------
      # Wait for GitHub Pages deployment
      # -----------------------------------------------------
      - name: Wait for GitHub Pages
        run: |
          echo "Waiting for GitHub Pages deployment..."
          sleep 30

      # -----------------------------------------------------
      # Run Playwright tests
      # -----------------------------------------------------
      - name: Run Playwright tests
        id: playwright_tests
        continue-on-error: true
        run: npx playwright test

      # -----------------------------------------------------
      # Generate Allure report
      # -----------------------------------------------------
      - name: Generate Allure report
        if: always()
        run: |
          npx allure generate allure-results \
            --clean \
            -o allure-report

      # -----------------------------------------------------
      # Upload Playwright report
      # -----------------------------------------------------
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 14

      # -----------------------------------------------------
      # Upload Allure report
      # -----------------------------------------------------
      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.run_number }}
          path: allure-report/
          retention-days: 14

      # -----------------------------------------------------
      # Prepare Allure Pages
      # -----------------------------------------------------
      - name: Prepare Allure Pages
        if: always()
        run: |
          mkdir -p pages-deploy

          cp -r allure-report/* pages-deploy/

          mkdir -p pages-deploy/runs/${{ github.run_number }}

          cp -r allure-report/* \
            pages-deploy/runs/${{ github.run_number }}/

          echo "Allure report prepared."

      # -----------------------------------------------------
      # Deploy Allure report
      # -----------------------------------------------------
      - name: Deploy Allure report
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages-deploy
          publish_branch: allure-report
          keep_files: true

      # -----------------------------------------------------
      # Fail workflow if Playwright tests failed
      # -----------------------------------------------------
      - name: Check Playwright test result
        if: steps.playwright_tests.outcome == 'failure'
        run: |
          echo "Playwright tests failed."
          exit 1
