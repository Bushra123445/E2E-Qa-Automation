
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>E2E QA Automation - Login</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 430px;
        }

        .login-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 38px 34px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
        }

        .brand-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            border-radius: 18px;
            background: #0d6efd;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        .login-title {
            font-weight: 700;
            color: #212529;
            margin-bottom: 8px;
        }

        .login-subtitle {
            color: #6c757d;
            margin-bottom: 30px;
        }

        .form-label {
            font-weight: 600;
            color: #343a40;
        }

        .form-control {
            height: 48px;
            border-radius: 10px;
        }

        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.15);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper .form-control {
            padding-right: 48px;
        }

        #togglePassword {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #6c757d;
            cursor: pointer;
            font-size: 18px;
            padding: 5px;
        }

        #togglePassword:hover {
            color: #0d6efd;
        }

        #loginButton {
            height: 48px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 16px;
        }

        #message {
            display: none;
            margin-top: 18px;
            border-radius: 10px;
            padding: 12px;
            font-size: 14px;
        }

        .footer-text {
            text-align: center;
            color: #6c757d;
            font-size: 13px;
            margin-top: 22px;
        }

        @media (max-width: 480px) {
            body {
                padding: 15px;
            }

            .login-card {
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>

<div class="login-wrapper">

    <div class="login-card">

        <!-- Logo -->
        <div class="brand-icon">
            <i class="bi bi-shield-check"></i>
        </div>

        <!-- Heading -->
        <div class="text-center">
            <h2 class="login-title">Welcome Back</h2>
            <p class="login-subtitle">
                Sign in to E2E QA Automation
            </p>
        </div>

        <!-- Login Form -->
        <form id="loginForm">

            <!-- Username -->
            <div class="mb-3">
                <label for="username" class="form-label">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    class="form-control"
                    placeholder="Enter username"
                    autocomplete="username"
                    required
                >
            </div>

            <!-- Password -->
            <div class="mb-4">
                <label for="password" class="form-label">
                    Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        id="togglePassword"
                        aria-label="Show password"
                    >
                        <i class="bi bi-eye"></i>
                    </button>

                </div>
            </div>

            <!-- Login Button -->
            <button
                type="submit"
                id="loginButton"
                class="btn btn-primary w-100"
            >
                <i class="bi bi-box-arrow-in-right me-2"></i>
                Login
            </button>

            <!-- Message -->
            <div
                id="message"
                role="alert"
            ></div>

        </form>

        <div class="footer-text">
            E2E QA Automation • Playwright Testing Project
        </div>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // ================================
    // LOGIN CREDENTIALS
    // ================================

    const VALID_USERNAME = "admin";
    const VALID_PASSWORD = "admin123";


    // ================================
    // ELEMENTS
    // ================================

    const loginForm = document.getElementById("loginForm");
    const username = document.getElementById("username");
    const password = document.getElementById("password");
    const togglePassword = document.getElementById("togglePassword");
    const loginButton = document.getElementById("loginButton");
    const message = document.getElementById("message");


    // ================================
    // SHOW / HIDE PASSWORD
    // ================================

    togglePassword.addEventListener("click", function () {

        const isPassword =
            password.getAttribute("type") === "password";

        if (isPassword) {
            password.setAttribute("type", "text");

            togglePassword.innerHTML =
                '<i class="bi bi-eye-slash"></i>';

            togglePassword.setAttribute(
                "aria-label",
                "Hide password"
            );

        } else {
            password.setAttribute("type", "password");

            togglePassword.innerHTML =
                '<i class="bi bi-eye"></i>';

            togglePassword.setAttribute(
                "aria-label",
                "Show password"
            );
        }
    });


    // ================================
    // LOGIN
    // ================================

    loginForm.addEventListener("submit", function (event) {

        event.preventDefault();

        const enteredUsername = username.value.trim();
        const enteredPassword = password.value;

        message.style.display = "block";

        // Correct credentials
        if (
            enteredUsername === VALID_USERNAME &&
            enteredPassword === VALID_PASSWORD
        ) {

            message.className = "alert alert-success";
            message.textContent = "Login successful. Redirecting...";

            loginButton.disabled = true;

            /*
             * IMPORTANT:
             * Relative path works on:
             * - localhost
             * - GitHub Pages
             * - repository sub-paths
             */

            setTimeout(function () {
                window.location.href = "dashboard.html";
            }, 500);

        } else {

            message.className = "alert alert-danger";
            message.textContent =
                "Invalid username or password.";

        }
    });
</script>

</body>
</html>
